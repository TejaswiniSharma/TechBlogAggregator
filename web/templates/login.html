{% extends "base.html" %}
{% block title %}Log In — Distributed Readings{% endblock %}

{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 28px;">
  <div style="width:100%;max-width:360px;">
    <div style="text-align:center;margin-bottom:28px;">
      <svg width="36" height="36" viewBox="0 0 26 26" fill="none" style="margin:0 auto 12px;">
        <ellipse cx="13" cy="13" rx="8.5" ry="11.5" transform="rotate(-18 13 13)" fill="#E8F2EC" stroke="#4A7C59" stroke-width="1"/>
        <path d="M13 22 Q12 15 13 8" stroke="#4A7C59" stroke-width="1" stroke-linecap="round"/>
        <path d="M13 17 Q16 13 19 11" stroke="#8AB89A" stroke-width="0.8" stroke-linecap="round"/>
        <path d="M13 13 Q10 10 8 8.5" stroke="#8AB89A" stroke-width="0.8" stroke-linecap="round"/>
      </svg>
      <h1 style="font-family:'Lora',Georgia,serif;font-size:22px;font-weight:500;color:var(--bark);margin-bottom:4px;">Welcome back</h1>
      <p style="font-size:13px;color:var(--bark-muted);font-style:italic;">Sign in to your reading list</p>
    </div>

    <div style="background:#fff;border:0.5px solid var(--border-leaf);border-radius:var(--radius-xl);padding:28px;box-shadow:var(--shadow-card);">
      <form method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div style="margin-bottom:16px;">
          <label style="display:block;font-size:11px;color:var(--bark-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Username</label>
          <input
            type="text"
            name="username"
            required
            autocomplete="username"
            autofocus
            style="width:100%;padding:9px 12px;border:1px solid var(--border-leaf-strong);border-radius:var(--radius-md);font-size:13px;font-family:inherit;background:var(--cream);color:var(--bark);outline:none;box-sizing:border-box;"
            onfocus="this.style.borderColor='var(--leaf-mid)'"
            onblur="this.style.borderColor='var(--border-leaf-strong)'"
          />
        </div>

        <div style="margin-bottom:24px;">
          <label style="display:block;font-size:11px;color:var(--bark-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Password</label>
          <input
            type="password"
            name="password"
            required
            autocomplete="current-password"
            style="width:100%;padding:9px 12px;border:1px solid var(--border-leaf-strong);border-radius:var(--radius-md);font-size:13px;font-family:inherit;background:var(--cream);color:var(--bark);outline:none;box-sizing:border-box;"
            onfocus="this.style.borderColor='var(--leaf-mid)'"
            onblur="this.style.borderColor='var(--border-leaf-strong)'"
          />
        </div>

        <button type="submit" class="btn btn-leaf" style="width:100%;justify-content:center;padding:10px;">Log in</button>
      </form>

      <p style="text-align:center;font-size:12px;color:var(--bark-muted);margin-top:16px;">
        No account? <a href="/register" style="color:var(--leaf);text-decoration:none;">Register</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
